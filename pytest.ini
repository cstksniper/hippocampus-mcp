[pytest]
# Tests live under tests/ (historically scattered in scripts/; the publicly
# shareable batch was moved in on 2026-09-20)
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# No cache writes, to avoid errors on read-only mounts or in containers
addopts = -q --tb=short -p no:cacheprovider

# tests/conftest.py injects src/ into sys.path, so running a single file
# does not depend on an external PYTHONPATH
markers =
    slow: 需要加载嵌入模型，耗时较长
    perf: 性能阈值用例——受机器负载影响会偶发失败，CI 上建议单独跑或标记非阻断
