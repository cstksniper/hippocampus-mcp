[pytest]
# 用例都在 tests/ 下（历史上散在 scripts/，2026-09-20 已把可公开的那批迁入）
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# 不写缓存，避免在只读挂载或容器里报错
addopts = -q --tb=short -p no:cacheprovider

# tests/conftest.py 负责把 src/ 注入 sys.path，单独跑某个文件也不依赖外部 PYTHONPATH
markers =
    slow: 需要加载嵌入模型，耗时较长
    perf: 性能阈值用例——受机器负载影响会偶发失败，CI 上建议单独跑或标记非阻断
