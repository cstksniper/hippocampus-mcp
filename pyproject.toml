[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hippocampus-mcp"
version = "0.1.0"
description = "Long-term memory backend for AI hosts over MCP: 4-layer memory, slot-based context assembly, cascade-safe forgetting, CfC temporal encoding"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "cstksniper", email = "cstksniper@qq.com" },
]
maintainers = [
    { name = "cstksniper", email = "cstksniper@qq.com" },
]
keywords = ["mcp", "memory", "llm", "agent", "lnn", "cfc", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Upper bounds are pinned to empirically verified "actually runs" values, not guesses:
    #   mcp 2.3.0 / sentence-transformers 6.2.0 / torch 2.15.0 / transformers 5.22.1
    #   verified in a clean venv: server imports OK, all 46 tools register, embed_batch
    #   yields 384 dims.
    # Without upper bounds the first users would install versions I never validated
    # (hit on 2026-11-03: local machine had 1.29/5.6.1, while PyPI's latest was already
    # 2.3/6.2).
    "mcp>=1.0,<3",
    "torch>=2.0,<3",
    "ncps>=1.0,<2",
    "sentence-transformers>=2.0,<7",
    "numpy>=1.20,<3",
]

[project.urls]
# GitHub account is in place (2026-11-05); the initial 0.1.0 release was not uploaded to PyPI, so filling these in now is safe.
Homepage = "https://github.com/cstksniper/hippocampus-mcp"
Source = "https://github.com/cstksniper/hippocampus-mcp"
Issues = "https://github.com/cstksniper/hippocampus-mcp/issues"

# --- Optional dependencies ---
# The core service depends only on the required items above.
# The following three are all "lazy import + explicit degradation" in this project; missing
# them does not crash, the corresponding capability just degrades
# (see the various logs and docstrings).
[project.optional-dependencies]
# evaluation / baseline scripts call external LLM APIs (any OpenAI-compatible endpoint, injected via JUDGE_* environment variables)
llm = ["httpx>=0.24"]
# spaCy NER entity extraction (the English path; Chinese uses heuristics + the lexicon and does not need it)
ner = ["spacy>=3.7"]
# cross-process write lock; degrades to an optimistic lock when missing, conflicts still fail explicitly
lock = ["filelock>=3.12"]
# ONNX inference backend: measured startup 35.0s → 12.8s.
# Missing it does not affect functionality — onnx_backend defaults to auto, and with the
# dependency absent it silently falls back to torch (code path verified).
onnx = ["onnxruntime>=1.17", "tokenizers>=0.15"]
# development / testing
dev = ["pytest>=8.0"]
# install everything at once
all = ["httpx>=0.24", "spacy>=3.7", "filelock>=3.12", "onnxruntime>=1.17", "tokenizers>=0.15"]

[project.scripts]
# points at the cli: defaults to the launcher (the daemon shares a single copy of the model),
# and provides setup / doctor subcommands, consistent with the production entry's account.
hippocampus-mcp = "hippocampus_mcp.cli:main"

# package discovery config for the src layout
[tool.hatch.build.targets.wheel]
packages = ["src/hippocampus_mcp"]

# ⚠️ the sdist is **publicly downloadable**: `pip download hippocampus-mcp` gets exactly this package.
#    The default behavior would pack the whole repository in. This uses an **explicit whitelist**,
#    containing only the minimal set needed to "rebuild the same wheel from the sdist";
#    all other development artifacts and private corpora are kept out of the package.
#    Before adding a file, ask first: is it OK for this to be public?
[tool.hatch.build.targets.sdist]
include = [
    "/src/hippocampus_mcp",
    "/examples",
    "/README.md",
    "/README.zh-CN.md",
    "/LICENSE",
    "/pyproject.toml",
    "/CITATION.cff",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/docs/ARCHITECTURE.md",
    "/docs/SELECTION.md",
    "/docs/INTEGRATION.md",
    "/docs/PRIVACY.md",
    "/docs/BENCHMARKS.md",
    "/docs/assets",
]

# uv config: use the CPU build of PyTorch to avoid downloading the huge CUDA packages
[tool.uv]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
