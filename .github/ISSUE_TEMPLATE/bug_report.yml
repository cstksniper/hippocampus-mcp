name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please attach the output of `brain_stats()` first** —
        its self-report fields (NER backend, embedding model source, L0 dangling count,
        missing vector count) usually pinpoint the problem directly.

  - type: input
    id: version
    attributes:
      label: Version
      description: 'Output of `python -c "import hippocampus_mcp; print(hippocampus_mcp.__version__)"`'
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Difference between actual and expected behavior
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction steps
      description: |
        Please provide a reproduction script that does not depend on private data when possible.
        A zero-dependency template is available in `examples/quickstart.py` (hash backend, runs in ~10 seconds).
      render: python
    validations:
      required: true

  - type: textarea
    id: stats
    attributes:
      label: brain_stats() output
      description: Paste after redacting sensitive details. Pay special attention to ner_backend / embedder_model_source / vectors_missing
      render: json
    validations:
      required: false

  - type: dropdown
    id: backend
    attributes:
      label: Embedding backend
      options:
        - sentence_transformer (default)
        - hash
        - other
    validations:
      required: false

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, whether spaCy / sentence-transformers are installed
      placeholder: "Windows 11 / Python 3.11.9 / spaCy installed"
    validations:
      required: false
