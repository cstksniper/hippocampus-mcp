name: Feature request
description: Propose a new capability or an improvement to an existing one
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: |
        Describe the **scenario**, not the solution.
        Writing "multi-hop questions fail to recall the second-hop evidence"
        is easier to discuss than "please add graph traversal".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What do you suggest
      description: A preliminary idea is welcome; leaving it empty is fine too
    validations:
      required: false

  - type: dropdown
    id: layer
    attributes:
      label: Which layer is involved
      options:
        - Write path (ingest / extraction / dedup)
        - Retrieval path (recall / rerank / filtering)
        - Consumption layer (get_memory_context 5 slots)
        - Storage and persistence
        - MCP tool layer
        - Evaluation
        - Other / not sure
    validations:
      required: false

  - type: textarea
    id: verify
    attributes:
      label: How would you verify it works
      description: |
        This project speaks in verifiable numbers. If possible, state which metric
        you would use to verify the change (e.g. a LoCoMo F1 category, Hit@3, recall latency).
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: My suggestion does not depend on private data or personal absolute paths
        - label: I have searched existing issues; this is not a duplicate or already in progress
    validations:
      required: false
