name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Sync server.json version to tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build mcp-publisher from source
        run: |
          set -euo pipefail
          # The registry repo's release assets intermittently return 504.
          # Building the pinned tag from source via the Go module proxy
          # (with sum.golang.org content verification) avoids that dependency.
          go install github.com/modelcontextprotocol/registry/cmd/publisher@v1.8.8
          cp "$(go env GOPATH)/bin/publisher" ./mcp-publisher
          ./mcp-publisher --help

      # The PyPI publish workflow (release.yml) triggers on the same tag.
      # Registry validation checks that the PyPI release exists and its
      # README carries the mcp-name marker, so wait until it is visible.
      - name: Wait for PyPI release to be visible
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/hippocampus-mcp/json" | grep -q "\"version\":\"$VERSION\""; then
              echo "PyPI $VERSION visible"
              exit 0
            fi
            echo "waiting for PyPI $VERSION ($i/30)"
            sleep 10
          done
          echo "PyPI $VERSION not visible after 5 minutes"
          exit 1

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
