name: Release to PyPI

# Publishes to PyPI via GitHub Trusted Publishing (OIDC) — no API token stored.
#
# One-time setup on the PyPI side (needs the web UI):
#   pypi.org -> project -> Manage -> Publishing -> Add GitHub Trusted Publisher:
#     owner = cstksniper, repository = hippocampus-mcp,
#     workflow = release.yml, environment = (leave blank)
#
# Trigger: push a tag. The version in pyproject.toml MUST be bumped first and
# MUST match the tag (PyPI rejects re-uploads of an existing version — 0.1.0
# is already published, so the first usable tag is v0.2.0).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tool
        run: python -m pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: python -m pip install twine && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # OIDC identity for PyPI Trusted Publishing (no password/token used)
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
