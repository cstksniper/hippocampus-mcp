name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip + embedding models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .hf
          key: ${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # Prefetch embedding models for offline regression; ONNX artifacts are not downloaded.
      - name: Prefetch embedding models (offline regression)
        env:
          HF_HOME: ${{ github.workspace }}/.hf
          HF_HUB_DISABLE_XET: "1"
        run: |
          python - <<'PY'
          import glob
          from huggingface_hub import snapshot_download

          for repo in ("BAAI/bge-base-zh-v1.5",
                       "sentence-transformers/all-MiniLM-L6-v2"):
              tag = "models--" + repo.replace("/", "--")
              if glob.glob(f".hf/hub/{tag}/snapshots/*/config.json"):
                  print(f"[cache hit] {repo}")
                  continue
              print(f"[download] {repo}")
              snapshot_download(repo, ignore_patterns=["onnx/*", "onnx_int8/*", "*.onnx"])
          PY

      - name: Regression
        env:
          HF_HOME: ${{ github.workspace }}/.hf
          HF_HUB_DISABLE_XET: "1"
          HIPPOCAMPUS_EMB_CACHE: ${{ github.workspace }}/.hf/hub
          # Allow latency-threshold tests to fail non-blocking under load.
          HIPPOCAMPUS_PERF_MAX_SECONDS: "120"
        run: |
          python scripts/run_all_tests.py --timeout 1800 --allow-fail perf_write \
            -v --log-dir ci-logs

      # On failure, collect full logs and daemon subprocess logs for diagnosis.
      - name: Collect daemon subprocess logs (diagnostics)
        if: always()
        run: |
          mkdir -p ci-logs/daemon
          python - <<'PY'
          import glob, os, tempfile
          root = tempfile.gettempdir()
          pats = [os.path.join(root, "daemon-*.log*"),
                  os.path.join(root, "*", "daemon-*.log*"),
                  os.path.join(root, "*", "*", "daemon-*.log*")]
          srcs = [p for pat in pats for p in glob.glob(pat) if os.path.isfile(p)]
          srcs = sorted(set(srcs), key=os.path.getmtime, reverse=True)[:12]
          for i, p in enumerate(srcs):
              dst = os.path.join("ci-logs", "daemon",
                                 "%02d_%s" % (i, os.path.basename(p)))
              with open(p, "rb") as f, open(dst, "wb") as g:
                  g.write(f.read(65536))
              print("copied", p, "->", dst)
          print("collected", len(srcs), "daemon logs")
          PY
      - name: List failed-suite logs (diagnostics)
        if: always()
        run: ls -laR ci-logs/ 2>/dev/null || echo "ci-logs/ does not exist"
      - name: Upload full failed-suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs-py${{ matrix.python-version }}-attempt${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 7

  smoke:
    # Fast smoke without torch: only verifies "package imports + tool table is complete".
    # Purpose: when dependency installation breaks or after major changes, a clear red
    # appears within 5 minutes instead of waiting 60 minutes for full regression.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Protocol-layer smoke: install only light deps, verify the top-level import pulls no heavy libraries.
      - name: Install protocol-layer dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install "mcp>=1.0" "numpy>=1.20"
      - name: Top-level import must not pull heavy libraries
        env:
          PYTHONPATH: src
        run: |
          python -c "import hippocampus_mcp.server as s; print('imported ok')"

  install-e2e:
    # Acceptance from an external user's perspective: build the wheel, install it,
    # run quickstart, generate host config, and complete the MCP handshake.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Shares the pip wheel cache with regression (restore-keys prefix can hit),
      # but saves under a separate key so the two jobs don't fight over one immutable cache.
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py3.11-install-e2e-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py3.11-

      - name: Build wheel (project only)
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps -w dist/

      - name: Install wheel the user way in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/user_venv"
          "$RUNNER_TEMP/user_venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/user_venv/bin/pip" install dist/hippocampus_mcp-*.whl
          "$RUNNER_TEMP/user_venv/bin/python" -m pip show mcp | head -3

      # New-user path acceptance
      - name: New-user path acceptance
        shell: bash
        run: |
          set -o pipefail
          "$RUNNER_TEMP/user_venv/bin/python" scripts/verify_install_e2e.py --repo . \
            2>&1 | tee install-e2e.log

      # Upload acceptance logs
      - name: Upload acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-e2e-logs-attempt${{ github.run_attempt }}
          path: install-e2e.log
          if-no-files-found: warn
          retention-days: 7
